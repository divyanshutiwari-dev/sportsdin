{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-md-11">
                <div class="auth-card">
                    <div class="row g-0">

                        <!-- Left branding side -->
                        <div class="col-md-5 d-none d-md-flex auth-side">
                            <i class="bi bi-trophy-fill mb-3" style="font-size: 3rem; color:#6db3f2;"></i>
                            <h2>Start your journey.</h2>
                            <p class="text-white-50">One profile. Every achievement.
                               Seen by coaches across every sport.</p>
                            <ul class="list-unstyled small text-white-50 mb-0 mt-2">
                                <li class="mb-2"><i class="bi bi-check-circle-fill me-2" style="color:#6db3f2"></i>Free forever</li>
                                <li class="mb-2"><i class="bi bi-check-circle-fill me-2" style="color:#6db3f2"></i>Athlete-only network</li>
                                <li><i class="bi bi-check-circle-fill me-2" style="color:#6db3f2"></i>Get scouted faster</li>
                            </ul>
                        </div>

                        <!-- Right form side -->
                        <div class="col-md-7 p-4 p-md-5">
                            <h4 class="section-title mb-1">Create your account</h4>
                            <p class="text-muted-2 small mb-4">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>

                            <form method="POST" action="{{ url_for('register') }}">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Full Name</label>
                                    <input type="text" class="form-control" name="name"
                                           placeholder="e.g., Rahul Sharma" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email</label>
                                    <input type="email" class="form-control" name="email"
                                           placeholder="you@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Password</label>
                                    <input type="password" class="form-control" name="password"
                                           placeholder="Minimum 6 characters" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-semibold">I am a...</label>
                                    <select class="form-select" name="role">
                                        <option value="athlete">Athlete</option>
                                        <option value="coach">Coach / Selector</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-sd w-100">Agree & Join</button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
