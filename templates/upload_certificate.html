{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <div class="sd-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3"><i class="bi bi-file-earmark-arrow-up"></i></div>
                        <h4 class="section-title mb-1">Upload Certificate</h4>
                        <p class="text-muted-2 small mb-0">PDF, PNG or JPG. Max proof = max trust.</p>
                    </div>

                    <form method="POST" action="{{ url_for('upload_certificate') }}" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Certificate Title</label>
                            <input type="text" class="form-control" name="title"
                                   placeholder="e.g., District Level Participation Certificate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Issued Date</label>
                            <input type="text" class="form-control" name="issued_date"
                                   placeholder="e.g., March 2026">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Certificate File</label>
                            <input type="file" class="form-control" name="certificate_file"
                                   accept=".pdf,.png,.jpg,.jpeg" required>
                        </div>
                        <button type="submit" class="btn btn-sd w-100">Upload</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('profile') }}" class="small text-muted-2">
                            <i class="bi bi-arrow-left me-1"></i>Back to profile
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
