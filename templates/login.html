{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-md-11">
                <div class="auth-card">
                    <div class="row g-0">

                        <!-- Left branding side -->
                        <div class="col-md-5 d-none d-md-flex auth-side">
                            <i class="bi bi-lightning-charge-fill mb-3" style="font-size: 3rem; color:#6db3f2;"></i>
                            <h2>Welcome back, champ.</h2>
                            <p class="text-white-50">Your next opportunity is already
                               looking for you. Log in and stay visible.</p>
                        </div>

                        <!-- Right form side -->
                        <div class="col-md-7 p-4 p-md-5">
                            <h4 class="section-title mb-1">Sign in</h4>
                            <p class="text-muted-2 small mb-4">New to Sportsdin?
                               <a href="{{ url_for('register') }}">Join now</a></p>

                            <form method="POST" action="{{ url_for('login') }}">
                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Email</label>
                                    <input type="email" class="form-control" name="email"
                                           placeholder="you@example.com" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-semibold">Password</label>
                                    <input type="password" class="form-control" name="password"
                                           placeholder="Enter your password" required>
                                </div>
                                <button type="submit" class="btn btn-sd w-100">Sign In</button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
