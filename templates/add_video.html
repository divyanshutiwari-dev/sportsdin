{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <div class="sd-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3"><i class="bi bi-youtube"></i></div>
                        <h4 class="section-title mb-1">Add Match Video</h4>
                        <p class="text-muted-2 small mb-0">Paste a YouTube link of your best moments.</p>
                    </div>

                    <form method="POST" action="{{ url_for('add_video') }}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">YouTube Link</label>
                            <input type="text" class="form-control" name="youtube_link"
                                   placeholder="https://www.youtube.com/watch?v=..." required>
                            <small class="text-muted-2">Full link works — we'll grab the video ID for you.</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Title</label>
                            <input type="text" class="form-control" name="title"
                                   placeholder="e.g., Semi-final highlights 2026">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Description</label>
                            <textarea class="form-control" name="description" rows="2"
                                      placeholder="Optional short note..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-sd w-100">Add Video</button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('profile') }}" class="small text-muted-2">
                            <i class="bi bi-arrow-left me-1"></i>Back to profile
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
